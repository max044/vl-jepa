# Default configuration for VL-JEPA
# device: ""  # Removed to allow auto-detection in Config

# Model
clip_model: "facebook/vjepa2-vitl-fpc64-256"
predictor_model: "Qwen/Qwen2.5-0.5B"
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: ["q_proj", "v_proj"]
text_model: "sentence-transformers/all-MiniLM-L6-v2"

# Dimensions
x_dim: 1024
predictor_dim: 896
text_dim: 384
embed_dim: 384

# Video
num_frames: 16
frame_size: 224

# Training
batch_size: 4
lr: 0.0003
weight_decay: 0.01
epochs: 20
warmup_steps: 200
grad_clip: 1.0
temperature: 0.07
sigreg_weight: 0.1

# Optional features
use_regression: false
regression_loss_weight: 1.0
use_learnable_temp: false

# Data
data_dir: "./data"
videos_dir: "./data/Charades_v1_480"
anno_train: "./data/charades_sta_train.txt"
anno_test: "./data/charades_sta_test.txt"
val_split: 0.1

# Checkpoints
checkpoint_dir: "./checkpoints"
save_every: 2
val_every: 2
val_samples: 500
early_stopping_patience: 5

# Inference
window_sizes: [2.0, 4.0, 8.0, 16.0]
window_stride: 1.0
nms_threshold: 0.5
inference_batch_size: 32
top_k: 5
