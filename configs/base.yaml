# Default configuration for VL-JEPA
# device: ""  # Removed to allow auto-detection in Config

# Model
clip_model: "facebook/vjepa2-vitl-fpc64-256"
predictor_model: "Qwen/Qwen3.5-0.8B"
use_lora: false
predictor_layers: 0
text_model: "Qwen/Qwen3-Embedding-0.6B"

# Dimensions
x_dim: 1024
predictor_dim: 1024
text_dim: 1024
embed_dim: 1024

# Video
num_frames: 16
frame_size: 224

# Training
batch_size: 2
grad_accumulation: 2
lr: 0.0001
weight_decay: 0.05
epochs: 20
warmup_steps: 500
grad_clip: 1.0
temperature: 0.07
sigreg_weight: 0.1
y_encoder_lr_multiplier: 0.05
dtype: "bf16"

# Optional features
use_regression: false
regression_loss_weight: 1.0
use_learnable_temp: false

# Data
data_dir: "./data"
videos_dir: "./data/Charades_v1_480"
anno_train: "./data/charades_sta_train.txt"
anno_test: "./data/charades_sta_test.txt"
val_split: 0.1

# Checkpoints
checkpoint_dir: "./checkpoints"
save_every: 2
val_every: 2
val_samples: 500
early_stopping_patience: 5

# Inference
window_sizes: [2.0, 4.0, 8.0, 16.0]
window_stride: 1.0
nms_threshold: 0.5
inference_batch_size: 32
top_k: 5
